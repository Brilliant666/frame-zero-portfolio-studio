name: portfolio-platform

services:
  app:
    image: portfolio-platform-app:${PORTFOLIO_RELEASE:?PORTFOLIO_RELEASE is required}
    build:
      context: ..
      dockerfile: Dockerfile
    pull_policy: never
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health/ready',{cache:'no-store'}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      - backend

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    environment:
      PORTFOLIO_DOMAIN: ${PORTFOLIO_DOMAIN:?PORTFOLIO_DOMAIN is required}
      PORTFOLIO_LOG_LEVEL: ${PORTFOLIO_LOG_LEVEL:-INFO}
    ports:
      - "${PORTFOLIO_BIND_ADDRESS:?PORTFOLIO_BIND_ADDRESS is required}:${PORTFOLIO_HTTP_PORT:?PORTFOLIO_HTTP_PORT is required}:80"
      - "${PORTFOLIO_BIND_ADDRESS:?PORTFOLIO_BIND_ADDRESS is required}:${PORTFOLIO_HTTPS_PORT:?PORTFOLIO_HTTPS_PORT is required}:443"
    volumes:
      - type: bind
        source: ./caddy/${PORTFOLIO_CADDY_CONFIG:?PORTFOLIO_CADDY_CONFIG is required}
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ./caddy/portfolio-proxy.caddy
        target: /etc/caddy/portfolio-proxy.caddy
        read_only: true
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      - ingress
      - backend

networks:
  ingress: {}
  backend:
    internal: true

volumes:
  caddy_config: {}
  caddy_data: {}
