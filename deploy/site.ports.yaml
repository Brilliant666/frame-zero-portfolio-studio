# Optional host ingress. Omit this file when an existing proxy reaches Caddy
# through an explicitly connected Docker ingress network.
services:
  caddy:
    ports:
      - "${PORTFOLIO_SITE_BIND_ADDRESS:?PORTFOLIO_SITE_BIND_ADDRESS is required}:${PORTFOLIO_SITE_HTTP_PORT:?PORTFOLIO_SITE_HTTP_PORT is required}:80"
      - "${PORTFOLIO_SITE_BIND_ADDRESS:?PORTFOLIO_SITE_BIND_ADDRESS is required}:${PORTFOLIO_SITE_HTTPS_PORT:?PORTFOLIO_SITE_HTTPS_PORT is required}:443"
