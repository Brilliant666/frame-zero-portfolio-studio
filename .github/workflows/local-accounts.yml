name: Local Account PostgreSQL Integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-accounts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: account_test
          POSTGRES_PASSWORD: isolated-ci-test-only
          POSTGRES_DB: frame_zero_accounts_test
        ports: ['127.0.0.1:55433:5432']
        options: >-
          --health-cmd "pg_isready -U account_test -d frame_zero_accounts_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify complete pull request diff
        id: scope
        run: node scripts/ci-change-scope.mjs
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run_full != 'false'
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.run_full != 'false'
      - name: Install isolated Chromium for editor acceptance
        if: steps.scope.outputs.run_full != 'false'
        run: npx playwright install --with-deps chromium
      # Build intentionally receives no account configuration or database secrets.
      - run: npm run build
        if: steps.scope.outputs.run_full != 'false'
      - name: Real PostgreSQL and Standard Next identity tests
        if: steps.scope.outputs.run_full != 'false'
        run: node --test tests/local-accounts.test.mjs
        env:
          FRAME_ZERO_LOCAL_ACCOUNTS: '1'
          FRAME_ZERO_ACCOUNT_DATABASE_URL: postgresql://account_test:isolated-ci-test-only@127.0.0.1:55433/frame_zero_accounts_test
          FRAME_ZERO_ACCOUNT_SECRET: isolated-ci-account-test-secret-never-used-outside-tests-2026
          FRAME_ZERO_ACCOUNT_ORIGIN: http://127.0.0.1:3004
          FRAME_ZERO_EDITOR_BROWSER_SMOKE: '1'
          FRAME_ZERO_PUBLICATION_BROWSER_SMOKE: '1'
          FRAME_ZERO_BROWSER_OUTPUT_DIR: ${{ runner.temp }}/site-publication-browser
      - name: Production Site HTTPS, persistence, and fault acceptance
        if: steps.scope.outputs.run_full != 'false'
        run: npm run verify:production-site
        env:
          FRAME_ZERO_PRODUCTION_VERIFY: '1'
      - name: Isolated production Site evidence (no credentials or private data)
        if: always() && steps.scope.outputs.run_full != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: production-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/production-site-runtime/result.json
          if-no-files-found: warn
          retention-days: 14
      - name: Anonymous browser acceptance evidence (no traces or credentials)
        if: always() && steps.scope.outputs.run_full != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: site-editor-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/site-editor-browser/
            ${{ runner.temp }}/site-publication-browser/
          if-no-files-found: warn
          retention-days: 14
