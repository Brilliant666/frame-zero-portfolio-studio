name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, build, and bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify change-scope policy
        run: node --test tests/ci-change-scope.test.mjs

      - name: Classify complete pull request diff
        id: scope
        run: node scripts/ci-change-scope.mjs

      - name: Verify documentation and deployment approval contracts
        if: steps.scope.outputs.run_full == 'false'
        run: node --test tests/deployment-operations.test.mjs tests/pr24-limited-closure.test.mjs

      - name: Use Node.js
        if: steps.scope.outputs.run_full != 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run_full != 'false'
        run: npm ci

      - name: Lint
        if: steps.scope.outputs.run_full != 'false'
        run: npm run lint

      - name: Test, build, and enforce bundle budget
        if: steps.scope.outputs.run_full != 'false'
        run: npm test
